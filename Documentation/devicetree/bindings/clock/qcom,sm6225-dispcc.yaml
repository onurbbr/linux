%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm6225-dispcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Display Clock Controller for SM6225

maintainers:
  - Onur BÜBER <onurbuber@engineer.com>

description: |
  Qualcomm display clock control module provides the clocks, resets and power
  domains on SM6225.

  See also: include/dt-bindings/clock/qcom,dispcc-sm6225.h

properties:
  compatible:
    enum:
      - qcom,sm6225-dispcc

  clocks:
    items:
      - description: Board XO source
      - description: GPLL0 DISP DIV clock from GCC
      - description: Byte clock from DSI PHY0
      - description: Pixel clock from DSI PHY0

  power-domains:
    maxItems: 1

required:
  - compatible
  - clocks
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmcc.h>
    #include <dt-bindings/clock/qcom,gcc-sm6225.h>
    clock-controller@5f00000 {
      compatible = "qcom,sm6225-dispcc";
      reg = <0x5f00000 0x20000>;
      clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>,
               <&gcc GCC_DISP_GPLL0_DIV_CLK_SRC>,
               <&dsi0_phy 0>,
               <&dsi0_phy 1>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };
...
