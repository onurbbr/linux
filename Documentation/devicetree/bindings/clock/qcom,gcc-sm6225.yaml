%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-sm6225.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller on SM6225

maintainers:
  - Onur BÜBER <onurbuber@engineer.com>

description: |
  Qualcomm global clock control module provides the clocks, resets and power
  domains on SM6225.

  See also: include/dt-bindings/clock/qcom,gcc-sm6225.h

properties:
  compatible:
    const: qcom,gcc-sm6225

  clocks:
    items:
      - description: Board XO source
      - description: Board XO A source
      - description: Sleep clock source

  clock-names:
    items:
      - const: bi_tcxo
      - const: bi_tcxo_ao
      - const: sleep_clk

required:
  - compatible
  - clocks
  - clock-names
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmcc.h>
    clock-controller@1400000 {
        compatible = "qcom,gcc-sm6225";
        reg = <0x01400000 0x1f0000>;
        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
        clock-names = "bi_tcxo", "bi_tcxo_ao", "sleep_clk";
        clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>,
                 <&rpmcc RPM_SMD_XO_A_CLK_SRC>,
                 <&sleep_clk>;
    };
...
