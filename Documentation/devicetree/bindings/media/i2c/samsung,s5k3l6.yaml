%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k3l6.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K3L6 13MP MIPI CSI-2 image sensor

maintainers:
  - Vincent Cloutier <vincent@cloutier.co>
  - Purism Kernel Team <kernel@puri.sm>
  - Onur BÜBER <onurbuber@engineer.com>

description: |-
  The Samsung S5K3L6 is a raw Bayer image sensor with a MIPI CSI-2 image
  data interface and an I2C-compatible control bus.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k3l6

  reg:
    maxItems: 1

  clocks:
    description: Reference to the sensor input clock.
    maxItems: 1

  reset-gpios:
    description: Active-low reset GPIO.
    maxItems: 1

  vdda-supply:
    description: Analog power supply.

  vddd-supply:
    description: Digital core power supply.

  vddio-supply:
    description: Digital I/O power supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies:
            items:
              - const: 537500000
              - const: 600000000
              - const: 625000000

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - vdda-supply
  - vddd-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    /*
     * The master clock is board specific: the sensor accepts 19.2, 24 and
     * 25 MHz and derives its PLL settings from whichever is supplied.
     */
    clk_19m2: clock {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <19200000>;
    };

    reg_vdda: regulator-vdda {
        compatible = "regulator-fixed";
        regulator-name = "vdda";
        regulator-min-microvolt = <2800000>;
        regulator-max-microvolt = <2800000>;
    };

    reg_vddd: regulator-vddd {
        compatible = "regulator-fixed";
        regulator-name = "vddd";
        regulator-min-microvolt = <1200000>;
        regulator-max-microvolt = <1200000>;
    };

    reg_vddio: regulator-vddio {
        compatible = "regulator-fixed";
        regulator-name = "vddio";
        regulator-min-microvolt = <1800000>;
        regulator-max-microvolt = <1800000>;
    };

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k3l6";
            reg = <0x10>;

            clocks = <&clk_19m2>;

            reset-gpios = <&tlmm 24 GPIO_ACTIVE_LOW>;
            vdda-supply = <&reg_vdda>;
            vddd-supply = <&reg_vddd>;
            vddio-supply = <&reg_vddio>;

            orientation = <1>;
            rotation = <90>;

            port {
                camera_out: endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64
                        <537500000 600000000 625000000>;
                    remote-endpoint = <&mipi_csi2_in>;
                };
            };
        };
    };
...
