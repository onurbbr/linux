%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/qcom,sm6225.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM6225 Network-On-Chip interconnect

maintainers:
  - Onur BÜBER <onurbuber@engineer.com>

description:
  The Qualcomm SM6225 interconnect providers support adjusting the
  bandwidth requirements between the various NoC fabrics.

properties:
  compatible:
    enum:
      - qcom,sm6225-bimc
      - qcom,sm6225-cnoc
      - qcom,sm6225-snoc

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

# Child node's properties
patternProperties:
  '^interconnect-[a-z0-9]+$':
    type: object
    description:
      The interconnect providers do not have a separate QoS register space,
      but share parent's space.

    $ref: qcom,rpm-common.yaml#

    properties:
      compatible:
        enum:
          - qcom,sm6225-clk-virt
          - qcom,sm6225-mmrt-virt
          - qcom,sm6225-mmnrt-virt
          - qcom,sm6225-gpu-virt
          - qcom,sm6225-qup-virt

    required:
      - compatible

    unevaluatedProperties: false

required:
  - compatible
  - reg

allOf:
  - $ref: qcom,rpm-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sm6225.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>
    system_noc: interconnect@1880000 {
        compatible = "qcom,sm6225-snoc";
        reg = <0x1880000 0x5f080>;
        clocks = <&gcc GCC_SYS_NOC_CPUSS_AHB_CLK>,
                 <&gcc GCC_SYS_NOC_UFS_PHY_AXI_CLK>,
                 <&gcc GCC_SYS_NOC_USB3_PRIM_AXI_CLK>,
                 <&rpmcc RPM_SMD_IPA_CLK>;
        clock-names = "cpu_axi", "ufs_axi", "usb_axi", "ipa";
        #interconnect-cells = <2>;

        clk_virt: interconnect-clk {
            compatible = "qcom,sm6225-clk-virt";
            #interconnect-cells = <2>;
        };

        mmrt_virt: interconnect-mmrt {
            compatible = "qcom,sm6225-mmrt-virt";
            #interconnect-cells = <2>;
        };

        mmnrt_virt: interconnect-mmnrt {
            compatible = "qcom,sm6225-mmnrt-virt";
            #interconnect-cells = <2>;
        };
    };
...
